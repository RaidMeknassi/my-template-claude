name: Collect templates
on:
  push:
    paths: ['tools/collect.py', '.github/workflows/collect.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/collect.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Collect templates from Futurepedia"
          git push
